
name: Analisi geografica Veneto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Controlla sintassi
        run: |
          python -m py_compile analisi_veneto.py

      - name: Esegui analisi Veneto
        run: |
          python analisi_veneto.py

      - name: Verifica risultati
        run: |
          test -s output/mappa_superficie.png
          test -s output/mappa_distanza_venezia.png
          test -s output/comuni_veneto.geojson
          test -s output/classifiche_comuni.csv
          test -s output/statistiche_province.csv

      - name: Salva risultati
        uses: actions/upload-artifact@v4
        with:
          name: analisi-veneto
          path: |
            output/*.png
            output/*.csv
            output/*.geojson
          if-no-files-found: error
